name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.23'
          cache: true

      - name: Run unit and integration tests
        run: go test -v -race -cover ./...

      - name: Build binary
        run: go build -v -o bin/sard ./cmd/sard

      - name: Run supply-chain security guard
        run: python3 .github/scripts/repo_guard.py .
